<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koneksi Terputus : Cobascan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      padding: 2rem 1.75rem;
      max-width: 26rem;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }
    .logo-wrap {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.25rem;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      background: #fef2f2;
      border: 1px solid #fee2e2;
      color: #b91c1c;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .badge-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 9999px;
      background-color: #ef4444;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.5;
      color: #64748b;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: #4f46e5;
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }
    .btn:hover {
      background-color: #4338ca;
    }
    .btn:active {
      transform: scale(0.99);
    }
    .hint {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="/icons/icon-192.png" alt="Cobascan" />
    </div>
    <div class="badge">
      <span class="badge-dot"></span>
      Mode Offline
    </div>
    <h1>Koneksi Internet Terputus</h1>
    <p>
      Perangkat Anda sedang tidak terhubung ke internet atau sinyal di lokasi sedang lemah. Silakan periksa koneksi Wi-Fi atau data seluler Anda.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Coba Muat Ulang
    </button>
    <div class="hint">Cobascan Smart QR &amp; NFC Bisnis</div>
  </div>
</body>
</html>
